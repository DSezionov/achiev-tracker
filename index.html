<!doctype html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Особистий трекер досягнень у відеоіграх" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="color-scheme" content="dark light" />
    <title>Трекер досягнень</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <script>
      // Тема до першого малювання, щоб не було спалаху світлого/темного фону.
      try {
        var prefs = JSON.parse(localStorage.getItem('achievement-tracker:prefs') || '{}');
        if (prefs.theme === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Перейти до вмісту</a>
    <header class="app-header">
      <div class="app-header__inner">
        <a class="brand" href="#/" data-nav>
          <span class="brand__icon" aria-hidden="true"></span>
          <span class="brand__name">Досягнення</span>
        </a>
        <div class="app-header__actions">
          <span id="sync-status" class="sync-status" role="status" hidden>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="sync-status__label"></span>
          </span>
          <button id="theme-toggle" class="btn btn--icon" type="button"></button>
          <a id="settings-link" class="btn btn--icon" href="#/settings" data-nav aria-label="Налаштування" title="Налаштування"></a>
        </div>
      </div>
    </header>
    <main id="app" class="app-main" tabindex="-1">
      <noscript>Для роботи застосунку потрібен JavaScript.</noscript>
    </main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
